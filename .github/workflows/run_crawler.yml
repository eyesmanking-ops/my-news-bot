name: 執行新聞爬蟲

on:
  # 1. 自動定期執行：設定在每小時的第 5 分鐘（GitHub 會視伺服器狀況排隊延遲 10-30 分鐘執行）
  schedule:
    - cron: '5 * * * *'

  # 2. 手動觸發：完整保留您原本的設定，您隨時可以在手機 App 或網頁點擊按鈕立即執行
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝爬蟲套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser

    # 幫您原本的 main.py 留住記憶：每次執行前，把上一次的時間紀錄拿出來
    - name: 讀取時間紀錄快取
      uses: actions/cache@v4
      with:
        path: last_run_time.txt
        key: crawler-time-cache-${{ github.run_id }}
        restore-keys: |
          crawler-time-cache-

    - name: 執行 Python 主程式
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
